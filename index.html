<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ptuexam.com</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .container {
            width: 100%;
            max-width: 960px;
            padding: 0px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .verified-badge {
            background: maroon;
            border: maroon;
            color: white;
            text-align: center;
            padding: 0px;
            font-size: 30px;
            font-weight: lighter;
            font-family: Arial, Helvetica, sans-serif;
        }
        .document-wrapper {
            background: white;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
            overflow: hidden;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .image-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 10px;
            background: #e9ecef;
        }
        .image-container img {
            width: 100%;
            height: auto;
            max-width: 100%;
            display: block;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            border-radius: 4px;
        }
       
        @media (max-width: 600px) {
            .container { padding: 0px; }
            .download-bar { flex-direction: column; text-align: center; }
            .btn-group { justify-content: center; }
            .image-container { padding: 5px; }
            .verified-badge { font-size: 30px; }
        }
        @media print {
            .header, .download-bar, .footer, .verified-badge { display: none; }
        }
    </style>
</head>
<body>
    
    <div class="container">
        <div class="verified-badge">
            Online Degree/DMC Verification
        </div>
        <div class="document-wrapper">
            <div class="image-container">
                <img 
                    src="WhatsApp Image 2026-04-29 at 7.26.02 PM.jpeg" 
                    alt="Document"
                />
            </div>
           
                   
                </div>
            </div>
        </div>
    </div>
    
</body>
</html>
