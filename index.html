<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ptuexam.com</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        
        .container {
            width: 100%;
            height: 100pxpx;
            max-width: 960px;
            padding: 0px;
            flex: 1;
            display: flex;
            flex-direction: column;
            
        }
        .verified-badge {
            background: maroon;
            border: maroon;
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 8px 8px 0 0;
            font-size: 50px;
            font-weight: lighter;
            font-family: Arial, Helvetica, sans-serif;
        }
        .document-wrapper {
            background: white;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
            overflow: hidden;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .document-viewer {
            width: 100%;
            min-height: 85vh;
            border: none;
            flex: 1;
        }
        .download-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: #f8f9fa;
            border-top: 1px solid #e9ecef;
            flex-wrap: wrap;
            gap: 12px;
        }
        .download-bar .label {
            color: #495057;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: none;
        }
        .btn-primary {
            background: #0d6efd;
            color: white;
        }
        .btn-primary:hover { background: #0b5ed7; }
        .btn-success {
            background: #198754;
            color: white;
        }
        .btn-success:hover { background: #157347; }
        .btn-outline {
            background: transparent;
            color: #0d6efd;
            border: 1px solid #0d6efd;
        }
        .btn-outline:hover { background: #e7f1ff; }
        .footer {
            width: 100%;
            text-align: center;
            padding: 16px;
            color: #6c757d;
            font-size: 12px;
        }
        @media (max-width: 600px) {
            .container { padding: 10px; }
            .download-bar { flex-direction: column; text-align: center; }
            .btn-group { justify-content: center; }
            .document-viewer { min-height: 60vh; }
        }
        @media print {
            .header, .download-bar, .footer, .verified-badge { display: none; }
        }
    </style>
</head>
<body>
    
    <div class="container">
        <div class="verified-badge">
            Online Degree/DMC Verification
        </div>
        <div class="document-wrapper">
            <iframe 
                class="document-viewer" 
                src="WhatsApp Image 2026-04-29 at 7.26.02 PM.jpeg" 
                type="application/pdf"
                title="Document Viewer"
                loading="lazy">
               
                </div>
            </div>
        </div>
    </div>
    
</body>
</html>
